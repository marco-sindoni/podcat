# USD per million tokens. Update when prices change.
news_model: claude-haiku-5-5
models:
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
# Model per script step (spec 002). Change one line to switch model; read on every run.
script_models:
  room: claude-haiku-5-5
  head_writer: claude-sonnet-5-5
  revision: claude-sonnet-5-5
# Thinking effort per script step: off (no thinking, cheapest), low, medium, high.
script_effort:
  room: "off"
  head_writer: low
  revision: low
